{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card auth-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h1 class="h4 fw-bold mb-1">Reset Password</h1>
                        <p class="text-muted mb-0">Enter your email to receive a reset link.</p>
                    </div>
                    <form method="post" class="auth-form">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-accent w-100">Send Reset Link</button>
                    </form>
                    <p class="text-center text-muted mt-3 mb-0">
                        Remembered your password? <a href="{% url 'login' %}">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
